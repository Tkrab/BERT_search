<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 航运文献检索系统</title>
    <link rel="stylesheet" href="../static/css/styles.css">
</head>

<body class="bg-gray-50">
    <header class="bg-gray-800 text-white p-4">
        <!-- <h1 class="text-2xl font-bold text-center">航运文献检索系统</h1> -->
        <a href="/" class="text-2xl font-bold hover:text-gray-300">航运文献检索系统</a>
    </header>

    <div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-lg shadow-md">
        <h2 class="text-2xl font-bold mb-6 text-center">用户注册</h2>
        <form id="registerForm" class="space-y-4">
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="username">用户名</label>
                <input type="text" id="username" name="username" required class="w-full px-3 py-2 border rounded-lg">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="email">邮箱</label>
                <input type="email" id="email" name="email" required class="w-full px-3 py-2 border rounded-lg">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="password">密码</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-3 py-2 border rounded-lg">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 mb-2" for="confirm_password">确认密码</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                    class="w-full px-3 py-2 border rounded-lg">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                注册
            </button>
            <div id="errorMessage" class="text-red-500 text-center hidden"></div>
        </form>
        <p class="mt-4 text-center">
            已有账号？ <a href="/login" class="text-blue-600 hover:underline">立即登录</a>
        </p>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const errorMessage = document.getElementById('errorMessage');

            if (password !== confirmPassword) {
                errorMessage.textContent = '两次输入的密码不一致';
                errorMessage.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch('/api/users/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, email, password })
                });

                if (response.ok) {
                    window.location.href = '/login'; // 注册成功后跳转到登录页
                } else {
                    const data = await response.json();
                    errorMessage.textContent = data.error || '注册失败';
                    errorMessage.classList.remove('hidden');
                }
            } catch (error) {
                errorMessage.textContent = '网络错误，请稍后重试';
                errorMessage.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
