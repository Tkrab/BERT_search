{% load static %}
<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 航运文献检索系统</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
    <header class="bg-gray-800 text-white p-4">
        <!-- <h1 class="text-2xl font-bold text-center">航运文献检索系统</h1> -->
        <a href="/" class="text-2xl font-bold hover:text-gray-300">航运文献检索系统</a>
    </header>

    <div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-lg shadow-md">
        <h2 class="text-2xl font-bold mb-6 text-center">用户登录</h2>
        <form id="loginForm" class="space-y-4">
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="username">用户名</label>
                <input type="text" id="username" name="username" required class="w-full px-3 py-2 border rounded-lg">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 mb-2" for="password">密码</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-3 py-2 border rounded-lg">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                登录
            </button>
            <div id="errorMessage" class="text-red-500 text-center hidden"></div>
        </form>
        <p class="mt-4 text-center">
            还没有账号？ <a href="/register" class="text-blue-600 hover:underline">立即注册</a>
        </p>
    </div>

    <script>
        // 添加 getCookie 函数
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const errorMessage = document.getElementById('errorMessage');

                try {
                    console.log('开始发送登录请求');
                    const response = await fetch('/api/users/login/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': getCookie('csrftoken')
                        },
                        credentials: 'include',
                        body: JSON.stringify({ username, password })
                    });

                    console.log('收到响应:', response);
                    const data = await response.json();
                    console.log('响应数据:', data);

                    if (response.ok) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify({
                            username: username,
                            id: data.id,
                            is_superuser: data.is_superuser,
                            is_staff: data.is_staff
                        }));

                        console.log('数据保存完成，准备跳转');
                        window.location.href = '/';
                    } else {
                        errorMessage.textContent = data.error || '用户名或密码错误';
                        errorMessage.classList.remove('hidden');
                    }
                } catch (error) {
                    console.error('登录请求错误:', error);
                    errorMessage.textContent = '网络错误，请稍后重试';
                    errorMessage.classList.remove('hidden');
                }
            });
        });
    </script>
</body>

</html>
